plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing lives OUTSIDE the repository (../keystore/keystore.properties). Without it the
// release build type falls back to the debug key so `assembleRelease` still works for anyone who
// clones the project; only builds meant for other people's phones need the real key.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('../keystore/keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Local-only key. Never commit credentials; builds without a key keep OpenStreetMap available.
def mapsLocalProps = new Properties()
def mapsLocalFile = rootProject.file('local.properties')
if (mapsLocalFile.exists()) mapsLocalFile.withInputStream { mapsLocalProps.load(it) }
def mapsSecretsFile = rootProject.file('secrets.properties')
if (mapsSecretsFile.exists()) mapsSecretsFile.withInputStream { mapsLocalProps.load(it) }
def mapsApiKey = mapsLocalProps.getProperty('MAPS_API_KEY', System.getenv('MAPS_API_KEY') ?: '').trim()

android {
    signingConfigs {
        if (keystoreProps['storeFile']) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    namespace 'app.pikminbloom.gps'
    compileSdk 37

    defaultConfig {
        applicationId "app.pikminbloom.gps"
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName "1.2.1"
        manifestPlaceholders = [mapsApiKey: mapsApiKey]
        buildConfigField 'boolean', 'HAS_GOOGLE_MAPS_KEY', mapsApiKey ? 'true' : 'false'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ""
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Location: mock providers via LocationManager + Fused Location Provider mock mode
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    // Health Connect: step / distance injection that Pikmin Bloom reads
    implementation 'androidx.health.connect:connect-client:1.1.0'
    // Map (OpenStreetMap, no API key)
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    testImplementation 'junit:junit:4.13.2'
    // android.jar ships org.json as method stubs, so JSON parsing returns nothing in unit tests.
    // The real implementation is needed to test OverpassClient / WaypointStore parsing.
    testImplementation 'org.json:json:20250517'
}
